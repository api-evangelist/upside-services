name: Upside Services
description: Upside (Upside Services, Inc.) is a retail technology company whose
  platform delivers personalized cash-back offers on gas, groceries, and dining
  to more than five million consumers through the Upside app and embedded partner
  experiences. Merchants across fuel and convenience, grocery, and restaurants pay
  only for measured incremental profit, verified against control groups. Upside
  operates an enterprise partner API used by companies like Fiserv, GasBuddy,
  Lyft, Uber, and Marqeta to embed offers, but publishes no public developer
  portal, API documentation, or SDKs - API access is arranged through its
  partnerships team. Backed by DCVC (first invested 2016).
